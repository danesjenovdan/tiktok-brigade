[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "tiktok-brigade"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "Django==6.1.2",
    "psycopg2-binary==2.9.13",
    "boto3==1.43.125",
    "django-storages==1.14.6",
    "gunicorn==26.2.0",
    "sentry-sdk==2.74.0",
    "requests==2.34.2",
    "jmespath==1.1.0",
    "yt-dlp==2026.10.26",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "ipython==9.18.1",
    "isort",
]

[tool.setuptools.packages.find]
include = ["tiktok_brigade*", "tiktok*"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
